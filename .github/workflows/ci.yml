name: ci
on: [push, pull_request]
jobs:
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build toolchain image
        run: docker build -t staticpy .
      - name: Run self-check
        run: docker run --rm -v "$PWD":/w -w /w staticpy bash selfcheck.sh
